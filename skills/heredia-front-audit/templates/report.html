<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heredia-front-audit report</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1d21; --muted: #646a73; --line: #e2e0d9;
    --accent: #2f5bd3; --code-bg: #f0eee8;
    --critical: #b42318; --critical-bg: #fde8e6;
    --high: #c4520a; --high-bg: #fdeedd;
    --medium: #8a6a00; --medium-bg: #fbf3d5;
    --low: #2d6a4f; --low-bg: #e3f2ea;
    --info: #4b5563; --info-bg: #eceef1;
    --pass: #2d6a4f; --fail: #b42318; --partial: #8a6a00; --skipped: #646a73;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1a1d22; --ink: #e8e9ec; --muted: #9aa1ab; --line: #2a2f37;
      --accent: #7aa2ff; --code-bg: #22262d;
      --critical: #ff8a80; --critical-bg: #3a1d1b;
      --high: #ffb074; --high-bg: #3a2715;
      --medium: #f2d16b; --medium-bg: #332b12;
      --low: #7fd1a8; --low-bg: #16301f;
      --info: #b8bfc9; --info-bg: #262a31;
      --pass: #7fd1a8; --fail: #ff8a80; --partial: #f2d16b; --skipped: #9aa1ab;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 120px; }
  code, pre, .mono { font-family: var(--mono); font-size: 13px; }
  a { color: var(--accent); }

  header .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  header h1 { margin: 8px 0 6px; font-size: 28px; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font: 13px var(--mono); }
  .summary { margin: 20px 0; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; }

  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--panel); cursor: pointer; font: 600 13px var(--sans); color: var(--ink); }
  .chip b { font-family: var(--mono); }
  .chip[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }

  h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; }

  .finding { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .finding.hidden { display: none; }
  .f-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; cursor: pointer; }
  .f-head input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  .f-title { font-weight: 650; font-size: 16px; }
  .f-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 4px 7px; border-radius: 4px; background: var(--info-bg); color: var(--info); }
  .sev-critical { background: var(--critical-bg); color: var(--critical); }
  .sev-high { background: var(--high-bg); color: var(--high); }
  .sev-medium { background: var(--medium-bg); color: var(--medium); }
  .sev-low { background: var(--low-bg); color: var(--low); }
  .f-id { font: 600 12px var(--mono); color: var(--muted); }
  .f-body { padding: 0 16px 16px 45px; display: none; }
  .finding.open .f-body { display: block; }
  .f-body dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; margin: 0 0 12px; }
  .f-body dt { color: var(--muted); font-size: 13px; }
  .f-body dd { margin: 0; }
  .f-body ol { margin: 0; padding-left: 18px; }
  pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; }
  .fix { margin-top: 12px; padding: 12px 14px; border-radius: 8px; border: 1px dashed var(--accent); }
  .fix-label { font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .shot { margin-top: 10px; max-width: 100%; max-height: 360px; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; display: block; }
  .row-actions { margin-top: 12px; display: flex; gap: 8px; }

  button.btn { font: 600 13px var(--sans); padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0d1117; } }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  .res { font: 700 12px var(--mono); text-transform: uppercase; }
  .res-pass { color: var(--pass); } .res-fail { color: var(--fail); } .res-partial { color: var(--partial); } .res-skipped { color: var(--skipped); }
  .files { columns: 2; column-gap: 24px; font: 13px var(--mono); padding: 0; list-style: none; }
  .files li { padding: 2px 0; break-inside: avoid; }
  .files .st { display: inline-block; width: 26px; color: var(--muted); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
  .bar .inner { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .count { color: var(--muted); font-size: 13px; margin-right: auto; }
  .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(900px, 94vw); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .d-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  dialog pre { margin: 0; border-radius: 0; max-height: 70vh; overflow: auto; }
  .lightbox img { max-width: 100%; display: block; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  @media (max-width: 640px) {
    .f-body { padding-left: 16px; }
    .f-body dl { grid-template-columns: 1fr; }
    .files { columns: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">heredia-front-audit · E2E review of uncommitted changes</div>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="counts" id="counts"></div>

  <h2>Findings</h2>
  <div id="findings"></div>

  <h2>Flows tested</h2>
  <div id="flows"></div>

  <h2>Changed files</h2>
  <ul class="files" id="files"></ul>
</div>

<div class="bar"><div class="inner">
  <span class="count" id="selcount"></span>
  <button class="btn" id="selAll">Select all</button>
  <button class="btn" id="selNone">Select none</button>
  <button class="btn" id="preview">Preview prompt</button>
  <button class="btn primary" id="copy">Copy fix prompt</button>
</div></div>
<div class="toast" id="toast"></div>

<dialog id="promptDlg">
  <div class="d-head"><strong id="dlgTitle">Fix prompt</strong>
    <span><button class="btn primary" id="copy2">Copy</button> <button class="btn" id="close">Close</button></span></div>
  <pre id="promptText"></pre>
</dialog>
<dialog id="imgDlg" class="lightbox"></dialog>

<script>
const DATA = /*__HEREDIA_FRONT_AUDIT_DATA__*/null;
const SEV = ["critical", "high", "medium", "low", "info"];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);
const selected = new Set(DATA.findings.filter((f) => f.severity !== "info").map((f) => f.id));
let filter = null;

$("title").textContent = DATA.project ? `${DATA.project}` : "heredia-front-audit report";
document.title = `heredia-front-audit · ${DATA.project || "report"}`;
$("meta").innerHTML = [
  DATA.branch && `branch <b>${esc(DATA.branch)}</b>${DATA.commit ? " @ " + esc(DATA.commit) : ""}`,
  DATA.baseUrl && `app ${esc(DATA.baseUrl)}`,
  DATA.stack && `stack ${esc(DATA.stack)}`,
  DATA.agentInfo && DATA.agent && `agent ${esc(DATA.agentInfo.name)}`,
  `browser ${esc(DATA.browser || "none")}`,
  `generated ${esc(new Date(DATA.generatedAt).toLocaleString())}`,
].filter(Boolean).map((s) => `<span>${s}</span>`).join("");
$("summary").textContent = DATA.summary || "No summary provided.";

function renderCounts() {
  $("counts").innerHTML = SEV.map((s) => {
    const n = DATA.findings.filter((f) => f.severity === s).length;
    return `<button class="chip" data-sev="${s}" aria-pressed="${filter === s}">
      <span class="dot" style="background:var(--${s})"></span>${s} <b>${n}</b></button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach((c) => c.onclick = () => {
    filter = filter === c.dataset.sev ? null : c.dataset.sev;
    renderCounts(); applyFilter();
  });
}

function findingHTML(f) {
  const loc = f.location || {};
  const where = [loc.file && `<code>${esc(loc.file)}${loc.line ? ":" + esc(loc.line) : ""}</code>`, loc.url && `page <code>${esc(loc.url)}</code>`].filter(Boolean).join(" · ");
  const ev = f.evidence || {};
  const rows = [
    where && ["Where", where],
    f.description && ["Problem", esc(f.description)],
    f.reproSteps?.length && ["Repro", `<ol>${f.reproSteps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`],
    f.expected && ["Expected", esc(f.expected)],
    f.actual && ["Actual", esc(f.actual)],
    ev.console && ["Console", `<pre>${esc(ev.console)}</pre>`],
  ].filter(Boolean);
  return `
  <article class="finding${f.severity === "critical" || f.severity === "high" ? " open" : ""}" data-id="${esc(f.id)}" data-sev="${f.severity}">
    <div class="f-head">
      <input type="checkbox" aria-label="Include ${esc(f.id)} in fix prompt" ${selected.has(f.id) ? "checked" : ""}>
      <div>
        <div class="f-title">${esc(f.title)}</div>
        <div class="f-tags">
          <span class="tag sev-${f.severity}">${f.severity}</span>
          ${f.category ? `<span class="tag">${esc(f.category)}</span>` : ""}
          ${f.source ? `<span class="tag">${f.source === "browser" ? "seen in browser" : "code review"}</span>` : ""}
        </div>
      </div>
      <span class="f-id">${esc(f.id)}</span>
    </div>
    <div class="f-body">
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      ${ev.screenshotData ? `<img class="shot" src="${ev.screenshotData}" alt="Screenshot for ${esc(f.id)}">` : (ev.screenshot ? `<div class="mono" style="color:var(--muted)">screenshot: ${esc(ev.screenshot)} (missing)</div>` : "")}
      ${f.fix ? `<div class="fix"><div class="fix-label">How to fix</div>
        <div>${esc(f.fix.explanation || "")}</div>${f.fix.snippet ? `<pre>${esc(f.fix.snippet)}</pre>` : ""}</div>` : ""}
      <div class="row-actions"><button class="btn copy-one">Copy prompt for ${esc(f.id)} only</button></div>
    </div>
  </article>`;
}

function renderFindings() {
  if (!DATA.findings.length) { $("findings").innerHTML = `<div class="empty">No findings — the changes behaved as expected in everything that was tested.</div>`; return; }
  $("findings").innerHTML = DATA.findings.map(findingHTML).join("");
  document.querySelectorAll(".finding").forEach((el) => {
    const id = el.dataset.id;
    const box = el.querySelector("input");
    el.querySelector(".f-head").onclick = (e) => { if (e.target !== box) el.classList.toggle("open"); };
    box.onchange = () => { box.checked ? selected.add(id) : selected.delete(id); updateCount(); };
    el.querySelector(".copy-one").onclick = () => copy(buildPrompt([id]));
    const img = el.querySelector(".shot");
    if (img) img.onclick = () => { $("imgDlg").innerHTML = `<img src="${img.src}" alt="">`; $("imgDlg").showModal(); };
  });
}

function applyFilter() {
  document.querySelectorAll(".finding").forEach((el) => el.classList.toggle("hidden", !!filter && el.dataset.sev !== filter));
}

function renderFlows() {
  if (!DATA.flowsTested.length) { $("flows").innerHTML = `<div class="empty">No browser flows were run.</div>`; return; }
  $("flows").innerHTML = `<table><thead><tr><th>Flow</th><th>Result</th><th>Steps / notes</th></tr></thead><tbody>${
    DATA.flowsTested.map((fl) => `<tr><td>${esc(fl.name)}</td><td class="res res-${esc(fl.result)}">${esc(fl.result)}</td>
      <td>${fl.steps?.length ? esc(fl.steps.join(" → ")) : ""}${fl.notes ? `<div style="color:var(--muted)">${esc(fl.notes)}</div>` : ""}</td></tr>`).join("")
  }</tbody></table>`;
}

function renderFiles() {
  $("files").innerHTML = DATA.changedFiles.map((f) => `<li><span class="st">${esc(f.status || "")}</span>${esc(f.path)}</li>`).join("") || "<li>(none listed)</li>";
}

function buildPrompt(ids) {
  const chunks = DATA.findings.filter((f) => ids.includes(f.id)).map((f) => f.promptChunk);
  return [DATA.prompt.header, chunks.join("\n\n"), DATA.prompt.footer].join("\n");
}

function updateCount() {
  $("selcount").textContent = `${selected.size} of ${DATA.findings.length} findings selected for the fix prompt`;
  $("copy").disabled = selected.size === 0;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  const t = $("toast"); t.textContent = `Copied — paste it into ${(DATA.agentInfo || {}).name || "your coding agent"}`; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

const selectedIds = () => DATA.findings.map((f) => f.id).filter((id) => selected.has(id));
$("copy").onclick = () => copy(buildPrompt(selectedIds()));
$("copy2").onclick = () => copy($("promptText").textContent);
$("preview").onclick = () => { $("promptText").textContent = buildPrompt(selectedIds()); $("promptDlg").showModal(); };
$("close").onclick = () => $("promptDlg").close();
$("imgDlg").onclick = () => $("imgDlg").close();
const syncBoxes = () => document.querySelectorAll(".finding").forEach((el) => el.querySelector("input").checked = selected.has(el.dataset.id));
$("selAll").onclick = () => { DATA.findings.forEach((f) => selected.add(f.id)); syncBoxes(); updateCount(); };
$("selNone").onclick = () => { selected.clear(); syncBoxes(); updateCount(); };

$("dlgTitle").textContent = `Fix prompt — paste into ${(DATA.agentInfo || {}).name || "your coding agent"}`;
renderCounts(); renderFindings(); renderFlows(); renderFiles(); updateCount();
</script>
</body>
</html>
