<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Heredia Tasks</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth">
  <main class="card login">
    <h1>Heredia Tasks</h1>
    <p class="muted">Sign in to your dashboard</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required aria-describedby="loginError">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="loginError">
      <p id="loginError" class="error" role="alert" hidden></p>
      <button type="submit" class="primary" id="loginBtn">Sign in</button>
    </form>
    <p class="hint">Demo account: <code>demo@example.com</code> / <code>demo1234</code></p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
